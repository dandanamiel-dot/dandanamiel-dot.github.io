<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>My Puppy</title>
<meta name="description" content="A little virtual puppy to feed, play with, dress up and build a house for.">
<meta name="theme-color" content="#8fd3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Puppy">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:ui-rounded,'Arial Rounded MT Bold','Nunito','Segoe UI',system-ui,sans-serif;
  background:#8fd3ff linear-gradient(#8fd3ff,#c9ecff);color:#4a3426;touch-action:manipulation}
button{font:inherit;color:inherit;border:none;cursor:pointer;padding:0}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));gap:8px}

/* header */
.head{display:flex;align-items:center;gap:10px}
.photo{width:46px;height:46px;border-radius:50%;border:3px solid #fff;object-fit:cover;box-shadow:0 3px 0 rgba(0,0,0,.12);flex:none}
#name{flex:1;min-width:0;font:inherit;font-weight:800;font-size:1.5rem;color:#4a3426;background:rgba(255,255,255,.55);
  border:none;border-radius:14px;padding:6px 12px;outline:none;user-select:text;-webkit-user-select:text}
#name:focus{background:#fff}
.round{width:46px;height:46px;border-radius:50%;background:#fff;font-size:1.4rem;box-shadow:0 3px 0 rgba(0,0,0,.12);flex:none}
.round:active{transform:translateY(2px);box-shadow:none}

/* stats */
.stats{display:flex;gap:8px}
.stat{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 9px 5px 6px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.stat span{font-size:1.25rem;line-height:1}
.bar{flex:1;height:13px;border-radius:99px;background:#efe6dc;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s,background .5s}

/* scene */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{container-type:size}
#scene{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh);border-radius:26px;overflow:hidden;
  box-shadow:0 8px 0 rgba(0,0,0,.1);background:#bfe8ff}
#scene svg{display:block;width:100%;height:100%}
.fx{position:absolute;pointer-events:none;font-size:calc(var(--s,1)*1.9rem);line-height:1;transform:translate(-50%,-50%);z-index:3}
.fx.up{animation:up 1.2s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% - 90px)) scale(1.2)}}
.fx.fly{transition:left .55s cubic-bezier(.3,.6,.4,1),top .55s cubic-bezier(.4,-.6,.7,1),transform .55s}
.fx.ball{animation:ball 1.8s linear forwards}
@keyframes ball{0%{left:-5%;top:40%}15%{top:84%}30%{top:45%}45%{top:84%}60%{top:55%}75%{top:84%}100%{left:105%;top:70%}}

/* dog animation */
#dogInner,#dogInner *{transform-box:fill-box}
#dogInner{transform-origin:50% 100%}
.tail{transform-origin:10% 90%;animation:wag .5s ease-in-out infinite alternate}
.sad .tail{animation-duration:1.6s}
.happy .tail{animation-duration:.22s}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(16deg)}}
.eyes{transform-origin:50% 50%;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.headg{transform-origin:50% 90%;animation:tilt 5s ease-in-out infinite}
@keyframes tilt{0%,60%,100%{transform:rotate(0)}70%,85%{transform:rotate(-5deg)}}
.jump{animation:jump .45s ease-out 3}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:scale(1.08,.9)}50%{transform:translateY(-55px) scale(.95,1.06)}}
.chomp{animation:chomp .22s ease-in-out 4}
@keyframes chomp{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.93)}}
.no{animation:no .25s ease-in-out 3}
@keyframes no{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.spin{animation:spin 1.2s ease-in-out}
@keyframes spin{0%{transform:scaleX(1)}25%{transform:scaleX(-1) translateY(-20px)}50%{transform:scaleX(1)}75%{transform:scaleX(-1) translateY(-20px)}100%{transform:scaleX(1)}}
.squish{animation:squish .35s ease-out}
@keyframes squish{0%,100%{transform:scale(1,1)}40%{transform:scale(1.07,.9)}}
#house{transform-box:fill-box;transform-origin:50% 100%}
.bang{animation:squish .3s ease-out}
#bubble{transition:opacity .3s}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* tray + toolbar */
#tray{height:186px;flex:none;background:#fff;border-radius:22px;padding:10px;overflow-y:auto;box-shadow:0 5px 0 rgba(0,0,0,.1);
  display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;justify-content:center}
.it{width:50px;height:50px;border-radius:15px;background:#fff4e6;font-size:1.75rem;line-height:1;display:grid;place-items:center;
  box-shadow:0 3px 0 #ecd9c2;flex:none}
.it:active{transform:translateY(3px);box-shadow:none}
.it.on{background:#ffe08a;box-shadow:0 3px 0 #e8b93b,0 0 0 3px #ffb703 inset}
.it svg{width:40px;height:40px}
.sw{border:3px solid #fff;box-shadow:0 0 0 2px #e6d5c3,0 3px 0 #e6d5c3;border-radius:50%}
.sw.on{box-shadow:0 0 0 4px #ffb703,0 3px 0 #e6d5c3}
.sep{flex-basis:100%;height:0}
.big{height:50px;padding:0 18px;border-radius:15px;font-size:1.6rem;font-weight:800;background:#7bd88f;color:#fff;box-shadow:0 4px 0 #4fae64;
  display:flex;align-items:center;gap:8px}
.big:active{transform:translateY(3px);box-shadow:none}
.big.wide{width:100%;height:64px;justify-content:center;font-size:2rem;background:#ffb703;box-shadow:0 5px 0 #d99400}
.dots{display:flex;gap:6px;width:100%;justify-content:center;margin-top:4px}
.dots i{width:18px;height:18px;border-radius:50%;background:#efe6dc}
.dots i.f{background:#7bd88f}
.tabs{display:flex;gap:8px;flex:none}
.tab{flex:1;height:62px;border-radius:20px;background:#fff;font-size:2rem;line-height:1;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.tab:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.tab.on{background:#ffd166;box-shadow:0 5px 0 #e0a92e}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <img class="photo" src="photo.jpg" alt="">
    <input id="name" maxlength="12" autocomplete="off" spellcheck="false" aria-label="Puppy name">
    <button class="round" id="mute" aria-label="Sound">🔊</button>
  </div>
  <div class="stats">
    <div class="stat"><span>🍖</span><div class="bar"><i id="b-food"></i></div></div>
    <div class="stat"><span>💖</span><div class="bar"><i id="b-fun"></i></div></div>
    <div class="stat"><span>💤</span><div class="bar"><i id="b-sleep"></i></div></div>
  </div>
  <div class="stage">
    <div id="scene">
      <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#dff4ff"/></linearGradient>
          <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff8fab"/><stop offset=".25" stop-color="#ffd166"/><stop offset=".5" stop-color="#8ee6a0"/>
            <stop offset=".75" stop-color="#8fd3ff"/><stop offset="1" stop-color="#c8a2ff"/></linearGradient>
        </defs>
        <rect width="400" height="400" fill="url(#sky)"/>
        <circle cx="345" cy="52" r="30" fill="#ffd93d"/>
        <g fill="#fff" opacity=".9"><ellipse cx="80" cy="60" rx="38" ry="15"/><ellipse cx="105" cy="48" rx="26" ry="15"/>
          <ellipse cx="235" cy="95" rx="30" ry="12"/><ellipse cx="252" cy="86" rx="20" ry="12"/></g>
        <path d="M0 290 Q100 250 200 275 T400 265 V400 H0Z" fill="#8ee08a"/>
        <path d="M0 320 Q120 290 240 312 T400 300 V400 H0Z" fill="#74d072"/>
        <g id="house" transform="translate(105,302)"></g>
        <ellipse id="shadow" cx="265" cy="374" rx="62" ry="10" fill="#000" opacity=".12"/>
        <g id="dog" transform="translate(265,235)"><g id="dogInner"><g id="dogArt"></g></g></g>
        <g id="night" opacity="0" style="transition:opacity .8s;pointer-events:none">
          <rect width="400" height="400" fill="#1b1b52" opacity=".55"/>
          <circle cx="345" cy="52" r="30" fill="#fff6c9"/><circle cx="333" cy="45" r="26" fill="#3d3d78"/>
          <g fill="#fff"><circle cx="60" cy="40" r="2.5"/><circle cx="150" cy="80" r="2"/><circle cx="220" cy="30" r="2.5"/><circle cx="280" cy="110" r="2"/><circle cx="30" cy="130" r="2"/></g>
        </g>
        <g id="bubble" opacity="0" style="pointer-events:none"><g class="bob" style="transform-box:fill-box">
          <ellipse cx="335" cy="130" rx="38" ry="32" fill="#fff"/><circle cx="312" cy="170" r="8" fill="#fff"/><circle cx="302" cy="186" r="5" fill="#fff"/>
          <text id="want" x="335" y="144" text-anchor="middle" font-size="38"></text></g></g>
      </svg>
    </div>
  </div>
  <div id="tray"></div>
  <div class="tabs">
    <button class="tab" data-t="feed" aria-label="Feed">🍖</button>
    <button class="tab" data-t="play" aria-label="Play">🎾</button>
    <button class="tab" data-t="house" aria-label="Dog house">🏠</button>
    <button class="tab" data-t="color" aria-label="Colors">🎨</button>
    <button class="tab" data-t="dress" aria-label="Dress up">🎀</button>
  </div>
</div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var KEY='my-puppy-v1';
var DEF={name:'Puppy',fur:'#d99a5b',pattern:'none',head:'',eyes:'',neck:'',mute:false,
  house:{stage:0,wall:'#f6c177',roof:'#e5484d',decor:[]},stats:{food:70,fun:70,sleep:80},t:Date.now()};
var S=JSON.parse(JSON.stringify(DEF));
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');
  if(sv){for(var k in sv)if(k!=='house'&&k!=='stats')S[k]=sv[k];
    Object.assign(S.house,sv.house||{});Object.assign(S.stats,sv.stats||{});}}catch(e){}
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// time away: puppy gets a bit hungry, never miserable
(function(){var mins=Math.max(0,(Date.now()-S.t)/60000);
  ['food','fun','sleep'].forEach(function(k){S.stats[k]=Math.max(Math.min(S.stats[k],30),S.stats[k]-mins*.5)})})();

var tab='feed',sleeping=false,busy=false;
var scene=$('#scene'),dogG=$('#dog'),inner=$('#dogInner'),art=$('#dogArt'),houseG=$('#house');

/* ---------- sound ---------- */
var ac=null;
function tone(f,d,type,vol,to,delay){if(S.mute)return;try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  var t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
var snd={
  pop:function(){tone(520,.09,'sine',.15,880)},
  woof:function(){tone(420,.11,'sawtooth',.12,210);tone(380,.13,'sawtooth',.12,180,.16)},
  chomp:function(){for(var i=0;i<4;i++)tone(180,.06,'square',.08,90,i*.2)},
  no:function(){tone(300,.15,'triangle',.14,200);tone(240,.2,'triangle',.14,160,.18)},
  bang:function(){tone(140,.1,'square',.16,60);tone(900,.04,'square',.05,400)},
  tada:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.22,'triangle',.14,0,i*.11)})},
  boing:function(){tone(260,.18,'sine',.14,620)},
  sleep:function(){tone(520,.5,'sine',.1,260)},
  bubble:function(){for(var i=0;i<5;i++)tone(600+Math.random()*700,.08,'sine',.08,1500,i*.09)}
};

/* ---------- colours ---------- */
function mix(a,b,t){var p=function(h){return [1,3,5].map(function(i){return parseInt(h.substr(i,2),16)})},x=p(a),y=p(b);
  return '#'+x.map(function(v,i){return ('0'+Math.round(v+(y[i]-v)*t).toString(16)).slice(-2)}).join('')}
function coat(){if(S.fur==='rainbow')return{m:'url(#rb)',d:'#c58cf5',l:'#fff6d6'};
  return{m:S.fur,d:mix(S.fur,'#5a3418',.22),l:mix(S.fur,'#ffffff',.5)}}

/* ---------- accessories ---------- */
var ACC={
 head:{
  party:'<polygon points="-24,-66 0,-128 24,-66" fill="#ff5fa2"/><polygon points="-14,-92 14,-92 19,-79 -19,-79" fill="#ffd93d"/><circle cx="0" cy="-130" r="9" fill="#4cc9f0"/>',
  crown:'<path d="M-30 -62 L-35 -102 L-17 -84 L0 -110 L17 -84 L35 -102 L30 -62Z" fill="#ffd23f" stroke="#e0a800" stroke-width="3" stroke-linejoin="round"/><circle cx="0" cy="-76" r="5" fill="#e5484d"/><circle cx="-18" cy="-73" r="4" fill="#3a86ff"/><circle cx="18" cy="-73" r="4" fill="#2ec4b6"/>',
  cap:'<path d="M-42 -60 A42 42 0 0 1 42 -60Z" fill="#3a86ff"/><path d="M28 -66 Q72 -70 82 -48 Q50 -58 26 -56Z" fill="#1d5fd1"/><circle cx="0" cy="-102" r="5" fill="#1d5fd1"/>',
  tophat:'<rect x="-38" y="-76" width="76" height="11" rx="5" fill="#2b2b33"/><rect x="-25" y="-124" width="50" height="52" rx="5" fill="#2b2b33"/><rect x="-25" y="-90" width="50" height="10" fill="#e5484d"/>',
  flower:'<g transform="translate(-36,-62)"><g fill="#ff8fab"><circle cx="0" cy="-12" r="9"/><circle cx="11" cy="-4" r="9"/><circle cx="7" cy="10" r="9"/><circle cx="-7" cy="10" r="9"/><circle cx="-11" cy="-4" r="9"/></g><circle r="7" fill="#ffd93d"/></g>',
  bow:'<path d="M0 -74 L-28 -92 L-28 -56Z M0 -74 L28 -92 L28 -56Z" fill="#ff5fa2"/><circle cx="0" cy="-74" r="8" fill="#e63d85"/>'},
 eyes:{
  glasses:'<g fill="rgba(255,255,255,.3)" stroke="#333" stroke-width="4"><circle cx="-22" cy="-22" r="15"/><circle cx="22" cy="-22" r="15"/></g><path d="M-7 -22 H7" stroke="#333" stroke-width="4"/>',
  sun:'<rect x="-41" y="-35" width="35" height="25" rx="11" fill="#222"/><rect x="6" y="-35" width="35" height="25" rx="11" fill="#222"/><path d="M-8 -26 H8" stroke="#222" stroke-width="5"/><path d="M-34 -29 l8 0 M13 -29 l8 0" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>',
  hearts:'<g fill="#ff5fa2" stroke="#e63d85" stroke-width="2"><path transform="translate(-22,-16) scale(1.25)" d="M0 6 C-18 -8 -8 -20 0 -10 C8 -20 18 -8 0 6Z"/><path transform="translate(22,-16) scale(1.25)" d="M0 6 C-18 -8 -8 -20 0 -10 C8 -20 18 -8 0 6Z"/></g><path d="M-6 -24 H6" stroke="#e63d85" stroke-width="4"/>'},
 neck:{
  collar:'<path d="M-38 36 Q0 66 38 36" fill="none" stroke="#e5484d" stroke-width="10" stroke-linecap="round"/><circle cx="0" cy="60" r="8" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/>',
  bandana:'<path d="M-42 34 Q0 52 42 34 L0 88Z" fill="#3a86ff"/><g fill="#fff"><circle cx="-12" cy="56" r="3"/><circle cx="10" cy="54" r="3"/><circle cx="0" cy="70" r="3"/></g>',
  bowtie:'<path d="M0 56 L-26 42 L-26 70Z M0 56 L26 42 L26 70Z" fill="#9b5de5"/><circle cx="0" cy="56" r="7" fill="#7b3fd1"/>',
  scarf:'<path d="M-38 38 Q0 64 38 38" fill="none" stroke="#2ec4b6" stroke-width="14" stroke-linecap="round"/><rect x="14" y="48" width="14" height="38" rx="4" fill="#2ec4b6"/><path d="M14 78 h14" stroke="#fff" stroke-width="3"/>',
  medal:'<path d="M-30 38 L0 68 L30 38" fill="none" stroke="#e5484d" stroke-width="6"/><circle cx="0" cy="72" r="13" fill="#ffd23f" stroke="#e0a800" stroke-width="3"/><text x="0" y="78" text-anchor="middle" font-size="15">⭐</text>'}
};
var VB={head:'-50 -138 100 100',eyes:'-46 -48 92 52',neck:'-48 26 96 66'};

/* ---------- dog ---------- */
function mood(){var s=S.stats,lo=Math.min(s.food,s.fun,s.sleep);
  return lo<25?'sad':(s.food+s.fun+s.sleep)/3>65?'happy':'ok'}
function drawDog(){
  var c=coat(),m=sleeping?'sleep':mood(),pat=S.pattern,h='';
  var W='#fffaf2';
  h+='<g class="tail"><g fill="'+c.d+'"><circle cx="58" cy="78" r="15"/><circle cx="72" cy="60" r="17"/><circle cx="82" cy="40" r="15"/></g></g>';
  h+='<ellipse cx="-42" cy="130" rx="20" ry="11" fill="'+c.d+'"/><ellipse cx="42" cy="130" rx="20" ry="11" fill="'+c.d+'"/>';
  h+='<ellipse cx="0" cy="85" rx="52" ry="54" fill="'+c.m+'"/>';
  if(pat==='patch')h+='<path d="M-50 70 Q-30 50 -20 75 Q-25 105 -48 100Z" fill="'+W+'"/>';
  if(pat==='spots')h+='<g fill="'+c.d+'"><circle cx="-34" cy="70" r="8"/><circle cx="36" cy="92" r="9"/><circle cx="-40" cy="100" r="6"/><circle cx="40" cy="62" r="5"/></g>';
  h+='<ellipse cx="0" cy="96" rx="29" ry="36" fill="'+c.l+'"/>';
  h+='<rect x="-35" y="82" width="25" height="52" rx="12" fill="'+c.m+'"/><rect x="10" y="82" width="25" height="52" rx="12" fill="'+c.m+'"/>';
  var paw=pat==='socks'?W:c.l;
  if(pat==='socks')h+='<rect x="-35" y="108" width="25" height="26" rx="12" fill="'+W+'"/><rect x="10" y="108" width="25" height="26" rx="12" fill="'+W+'"/>';
  h+='<ellipse cx="-22" cy="134" rx="16" ry="9" fill="'+paw+'"/><ellipse cx="22" cy="134" rx="16" ry="9" fill="'+paw+'"/>';
  h+=ACC.neck[S.neck]||'';
  h+='<g class="headg">';
  h+='<g fill="'+c.m+'"><circle cx="0" cy="-15" r="58"/><circle cx="-30" cy="-58" r="20"/><circle cx="0" cy="-66" r="22"/><circle cx="30" cy="-58" r="20"/><circle cx="-50" cy="8" r="17"/><circle cx="50" cy="8" r="17"/></g>';
  if(pat==='patch')h+='<circle cx="24" cy="-24" r="22" fill="'+W+'"/>';
  if(pat==='spots')h+='<g fill="'+c.d+'"><circle cx="-34" cy="-44" r="7"/><circle cx="40" cy="-8" r="6"/></g>';
  h+='<g fill="'+c.d+'"><ellipse cx="-58" cy="-2" rx="21" ry="42" transform="rotate(10 -58 -2)"/><ellipse cx="58" cy="-2" rx="21" ry="42" transform="rotate(-10 58 -2)"/><circle cx="-62" cy="30" r="14"/><circle cx="62" cy="30" r="14"/></g>';
  h+='<ellipse cx="0" cy="12" rx="30" ry="24" fill="'+c.l+'"/>';
  if(m==='happy')h+='<ellipse cx="0" cy="25" rx="8" ry="10" fill="#ff7a93"/>';
  h+='<path d="'+(m==='sad'?'M-11 24 Q0 14 11 24':'M-13 13 Q-6 23 0 13 Q6 23 13 13')+'" fill="none" stroke="#3a2a2a" stroke-width="3" stroke-linecap="round"/>';
  h+='<ellipse cx="0" cy="1" rx="11" ry="8" fill="#3a2a2a"/><ellipse cx="-3" cy="-2" rx="3.5" ry="2" fill="#fff" opacity=".6"/>';
  if(m==='sleep')h+='<path d="M-31 -21 Q-22 -13 -13 -21 M13 -21 Q22 -13 31 -21" fill="none" stroke="#2a1a1a" stroke-width="4" stroke-linecap="round"/>';
  else{h+='<g class="eyes"><circle cx="-22" cy="-22" r="10" fill="#1d1414" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/><circle cx="22" cy="-22" r="10" fill="#1d1414" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>'+
    '<circle cx="-25" cy="-26" r="3.5" fill="#fff"/><circle cx="19" cy="-26" r="3.5" fill="#fff"/></g>';
    if(m==='sad')h+='<path d="M-36 -38 L-14 -42 M36 -38 L14 -42" stroke="#3a2a2a" stroke-width="4" stroke-linecap="round" opacity=".7"/>';
    if(m==='happy')h+='<g fill="#ff8fab" opacity=".55"><ellipse cx="-38" cy="-2" rx="9" ry="6"/><ellipse cx="38" cy="-2" rx="9" ry="6"/></g>';}
  h+=(ACC.eyes[S.eyes]||'')+(ACC.head[S.head]||'')+'</g>';
  art.innerHTML=h;inner.setAttribute('class',(inner.getAttribute('class')||'').replace(/\b(sad|happy|ok|sleep)\b/g,'').trim()+' '+m);
  dogG.setAttribute('transform',sleeping?'translate(105,243) scale(.42)':'translate(265,235)');
  $('#shadow').style.display=sleeping?'none':'';
  $('#night').setAttribute('opacity',sleeping?1:0);
}

/* ---------- house ---------- */
var DECOR={flag:'🚩',flowers:'🌷',heart:'❤️',lights:'💡',balloon:'🎈'};
function drawHouse(){
  var H=S.house,s=H.stage,h='',has=function(d){return s>=4&&H.decor.indexOf(d)>=0};
  if(s===0)h+='<g fill="#c98b4e" stroke="#9c6630" stroke-width="2"><rect x="-55" y="-14" width="90" height="12" rx="3" transform="rotate(-6)"/><rect x="-40" y="-28" width="90" height="12" rx="3" transform="rotate(5)"/><rect x="-50" y="-42" width="80" height="12" rx="3" transform="rotate(-3)"/></g><text x="42" y="-30" font-size="30">🔨</text>';
  if(has('balloon'))h+='<path d="M72 -60 Q84 -90 78 -120" stroke="#888" fill="none" stroke-width="1.5"/><text x="62" y="-118" font-size="34">🎈</text>';
  if(s>=1)h+='<rect x="-78" y="-10" width="156" height="12" rx="4" fill="#b97a3e"/>';
  if(s>=2)h+='<rect x="-66" y="-98" width="132" height="90" rx="4" fill="'+H.wall+'" stroke="rgba(0,0,0,.12)" stroke-width="3"/>'+
    '<path d="M-32 -8 v-46 a32 32 0 0 1 64 0 v46z" fill="#5b3a23"/>';
  if(s===2)h+='<path d="M-66 -98 v-20 M66 -98 v-20" stroke="#b97a3e" stroke-width="8" stroke-linecap="round"/>';
  if(s>=3)h+='<path d="M-90 -92 L0 -162 L90 -92Z" fill="'+H.roof+'" stroke="rgba(0,0,0,.15)" stroke-width="3" stroke-linejoin="round"/>';
  if(s>=4)h+='<rect x="-24" y="-112" width="48" height="16" rx="8" fill="#fff" opacity=".9"/><text x="0" y="-99" text-anchor="middle" font-size="14">🦴</text>';
  if(has('heart'))h+='<text x="-58" y="-70" font-size="20">❤️</text><text x="36" y="-70" font-size="20">❤️</text>';
  if(has('flag'))h+='<path d="M0 -160 v-40" stroke="#8a5a3b" stroke-width="4" stroke-linecap="round"/><path d="M2 -200 l30 10 l-30 10z" fill="#ff5fa2"/>';
  if(has('lights')){var cs=['#ff5fa2','#ffd93d','#4cc9f0','#7bd88f'];for(var i=0;i<4;i++){var t=(i+.5)/4;
    h+='<circle cx="'+(-90+90*t)+'" cy="'+(-88-70*t)+'" r="6" fill="'+cs[i]+'"/><circle cx="'+(90-90*t)+'" cy="'+(-88-70*t)+'" r="6" fill="'+cs[3-i]+'"/>';}}
  if(has('flowers'))h+='<text x="-98" y="4" font-size="26">🌷</text><text x="68" y="4" font-size="26">🌻</text>';
  houseG.innerHTML=h;
}

/* ---------- effects ---------- */
function fx(e,x,y,cls,s){var d=document.createElement('div');d.className='fx '+(cls||'up');d.textContent=e;
  d.style.left=x+'%';d.style.top=y+'%';d.style.setProperty('--s',s||1);d.style.setProperty('--dx',(Math.random()*80-40)+'px');
  scene.appendChild(d);setTimeout(function(){d.remove()},2000);return d}
function burst(e,x,y,n){for(var i=0;i<n;i++)(function(i){setTimeout(function(){fx(e,x+Math.random()*24-12,y+Math.random()*16-8)},i*110)})(i)}
function anim(c,ms){inner.classList.remove('jump','chomp','no','spin','squish');void inner.getBBox();inner.classList.add(c);
  setTimeout(function(){inner.classList.remove(c)},ms)}
function add(k,v){S.stats[k]=Math.max(0,Math.min(100,S.stats[k]+v))}

/* ---------- stats ---------- */
function drawStats(){['food','fun','sleep'].forEach(function(k){var v=S.stats[k],b=$('#b-'+k);
  b.style.width=Math.max(6,v)+'%';b.style.background=v<25?'#ff6b6b':v<55?'#ffb703':'#7bd88f'});
  var s=S.stats,w='';
  if(!sleeping){if(s.food<35&&s.food<=s.fun&&s.food<=s.sleep)w='🍖';else if(s.sleep<35&&s.sleep<=s.fun)w=S.house.stage>=4?'💤':'🏠';else if(s.fun<35)w='🎾';}
  $('#want').textContent=w;$('#bubble').setAttribute('opacity',w?1:0);}
var lastMood='';
function refresh(){var m=sleeping?'sleep':mood();if(m!==lastMood){lastMood=m;drawDog()}drawStats()}

/* ---------- actions ---------- */
function wake(){if(!sleeping)return;sleeping=false;lastMood='';drawDog();refresh();snd.woof();anim('jump',1400);if(tab==='house')drawTray()}
function feed(e,v){wake();if(busy)return;
  if(S.stats.food>=98){snd.no();anim('no',800);fx('😋',66,40);return}
  busy=true;snd.pop();var d=fx(e,50,100,'fly',1.3);void d.offsetWidth;d.style.left='66%';d.style.top='62%';d.style.transform='translate(-50%,-50%) scale(.6)';
  setTimeout(function(){d.remove();snd.chomp();anim('chomp',900);add('food',v);add('fun',3);burst(e==='💧'?'💧':'✨',66,60,3);
    setTimeout(function(){busy=false;if(S.stats.food>=98){burst('💖',66,45,3);snd.tada()}refresh();save()},900)},560);}
var PLAY={
  ball:function(){fx('🎾',0,40,'ball',1.2);[0,450,900,1350].forEach(function(t){setTimeout(snd.boing,t)});anim('jump',1400);
    setTimeout(function(){snd.woof();burst('⭐',66,45,4)},1300);add('fun',22);add('sleep',-8);add('food',-4)},
  pet:function(){anim('squish',400);burst('💖',66,45,5);snd.pop();setTimeout(snd.woof,200);add('fun',12)},
  bath:function(){snd.bubble();anim('no',800);burst('🫧',66,60,9);setTimeout(function(){burst('✨',66,50,4)},900);add('fun',10)},
  dance:function(){anim('spin',1250);[523,659,784,659,523,784].forEach(function(f,i){tone(f,.16,'triangle',.12,0,i*.18)});burst('🎵',66,40,5);add('fun',18);add('sleep',-6)},
  treat:function(){feed('🍪',10)}
};
function play(k){wake();if(k!=='treat'&&S.stats.sleep<10){snd.no();anim('no',800);fx('🥱',66,40,'up',1.3);return}
  PLAY[k]();refresh();save()}
function build(){var H=S.house;if(H.stage>=4)return;H.stage++;snd.bang();setTimeout(snd.bang,180);
  drawHouse();houseG.classList.remove('bang');void houseG.getBBox();houseG.classList.add('bang');burst('💥',26,62,2);burst('⭐',26,50,3);
  if(H.stage===4){setTimeout(function(){snd.tada();burst('🎉',26,45,6);if(!sleeping){anim('jump',1400);snd.woof()}},350);add('fun',25)}
  refresh();drawTray();save()}
function sleep(){if(sleeping){wake();return}sleeping=true;lastMood='';refresh();snd.sleep();drawTray()}

/* ---------- tray ---------- */
var FOODS=[['🦴',22],['🍖',30],['🥕',14],['🍎',14],['🧀',16],['🍉',12],['💧',8]];
var FURS=['#d99a5b','#f0d9b0','#faf6ee','#8a5a3b','#474043','#a3a8ae','#ffa6c9','#8fd3ff','#b79cff','rainbow'];
var WALLS=['#f6c177','#ffadad','#a0c4ff','#caffbf','#fdffb6','#ffffff'];
var ROOFS=['#e5484d','#3a86ff','#2a9d8f','#9b5de5','#ff8fab'];
var PATS={none:'',patch:'<circle cx="26" cy="15" r="8" fill="#fff"/><circle cx="13" cy="27" r="6" fill="#fff"/>',
  spots:'<g fill="#8a5a3b"><circle cx="13" cy="15" r="4"/><circle cx="27" cy="18" r="5"/><circle cx="18" cy="29" r="4"/></g>',
  socks:'<path d="M5 26 A16 16 0 0 0 35 26Z" fill="#fff"/>'};
function btn(cls,html,fn,on,label){var b=document.createElement('button');b.className=cls+(on?' on':'');b.innerHTML=html;
  if(label)b.setAttribute('aria-label',label);b.onclick=fn;return b}
function sep(){var d=document.createElement('div');d.className='sep';return d}
function drawTray(){
  var t=$('#tray');t.innerHTML='';
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
  if(tab==='feed')FOODS.forEach(function(f){t.appendChild(btn('it',f[0],function(){feed(f[0],f[1])}))});
  if(tab==='play')[['ball','🎾'],['pet','🤚'],['bath','🛁'],['dance','🎵'],['treat','🍪']].forEach(function(p){
    t.appendChild(btn('it',p[1],function(){play(p[0])},false,p[0]))});
  if(tab==='color'){
    FURS.forEach(function(c){var b=btn('it sw','',function(){S.fur=c;snd.pop();anim('squish',400);drawDog();drawTray();save()},S.fur===c,'fur colour');
      b.style.background=c==='rainbow'?'linear-gradient(135deg,#ff8fab,#ffd166,#8ee6a0,#8fd3ff,#c8a2ff)':c;t.appendChild(b)});
    t.appendChild(sep());
    Object.keys(PATS).forEach(function(p){t.appendChild(btn('it','<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#d99a5b"/>'+PATS[p]+'</svg>',
      function(){S.pattern=p;snd.pop();anim('squish',400);drawDog();drawTray();save()},S.pattern===p,p))});
  }
  if(tab==='dress')['head','eyes','neck'].forEach(function(slot,i){if(i)t.appendChild(sep());
    Object.keys(ACC[slot]).forEach(function(k){t.appendChild(btn('it','<svg viewBox="'+VB[slot]+'">'+ACC[slot][k]+'</svg>',
      function(){S[slot]=S[slot]===k?'':k;snd.pop();if(S[slot]){anim('squish',400);burst('✨',66,45,3)}drawDog();drawTray();save()},S[slot]===k,k))})});
  if(tab==='house'){var H=S.house;
    if(H.stage<4){t.appendChild(btn('big wide','🔨 🪵',build,false,'Build'));
      var d=document.createElement('div');d.className='dots';for(var i=0;i<4;i++)d.innerHTML+='<i'+(i<H.stage?' class="f"':'')+'></i>';t.appendChild(d);}
    else{t.appendChild(btn('big',sleeping?'☀️':'💤',sleep,false,sleeping?'Wake up':'Sleep'));
      Object.keys(DECOR).forEach(function(k){t.appendChild(btn('it',DECOR[k],function(){var i=H.decor.indexOf(k);
        if(i>=0)H.decor.splice(i,1);else{H.decor.push(k);burst('✨',26,45,3)}snd.pop();drawHouse();drawTray();save()},H.decor.indexOf(k)>=0,k))});
      t.appendChild(sep());
      WALLS.forEach(function(c){var b=btn('it sw','',function(){H.wall=c;snd.pop();drawHouse();drawTray();save()},H.wall===c,'wall colour');b.style.background=c;t.appendChild(b)});
      t.appendChild(sep());
      ROOFS.forEach(function(c){var b=btn('it sw','🔺',function(){H.roof=c;snd.pop();drawHouse();drawTray();save()},H.roof===c,'roof colour');b.style.background=c;b.style.fontSize='1rem';t.appendChild(b)});
    }}
}

/* ---------- wiring ---------- */
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){tab=b.dataset.t;snd.pop();drawTray()}});
dogG.addEventListener('click',function(e){e.stopPropagation();if(sleeping){wake();return}play('pet')});
scene.addEventListener('click',function(){if(sleeping)wake()});
var nm=$('#name');nm.value=S.name;nm.oninput=function(){S.name=nm.value;save()};
nm.onkeydown=function(e){if(e.key==='Enter')nm.blur()};
var mu=$('#mute');function drawMute(){mu.textContent=S.mute?'🔇':'🔊'}
mu.onclick=function(){S.mute=!S.mute;drawMute();save();snd.pop()};

setInterval(function(){
  if(sleeping){add('sleep',6);add('food',-.4);fx('💤',30,52,'up',.9);if(S.stats.sleep>=100){wake();burst('☀️',66,40,2)}}
  else{add('food',-.5);add('fun',-.5);add('sleep',-.3)}
  refresh();save();
},2500);
document.addEventListener('visibilitychange',function(){if(document.hidden)save()});

drawMute();drawHouse();refresh();drawTray();
})();
</script>
</body>
</html>
